apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openstack

# The Deployment is patched separately, so Kustomize cannot rewrite its
# ConfigMap reference to a generated hash-suffixed name.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: sunrise-novnc
    files:
      - sunrise.html
      - sunrise.css
      - sunrise.js
