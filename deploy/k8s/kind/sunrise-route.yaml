apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sunrise
spec:
  parentRefs:
    - name: gateway
      namespace: envoy-gateway-system
  hostnames:
    - sunrise.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sunrise
          port: 80
      sessionPersistence:
        sessionName: sunrise-affinity
        type: Cookie
        absoluteTimeout: 24h
        cookieConfig:
          lifetimeType: Permanent
