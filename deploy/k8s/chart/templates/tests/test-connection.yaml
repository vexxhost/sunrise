apiVersion: v1
kind: Pod
metadata:
  name: {{ include "sunrise.fullname" . }}-test-connection
  labels:
    helm.sh/chart: {{ include "sunrise.chart" . }}
    app.kubernetes.io/name: {{ include "sunrise.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}-test
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ready
      image: {{ include "sunrise.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - node
        - -e
        - >-
          fetch('http://{{ include "sunrise.fullname" . }}:{{ .Values.service.port }}/readyz')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
