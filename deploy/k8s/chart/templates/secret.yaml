{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sunrise.secretName" . }}
  labels:
    {{- include "sunrise.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if .Values.secret.stringData }}
  {{- range $name, $value := .Values.secret.stringData }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
  {{- else }} {}
  {{- end }}
{{- end }}
