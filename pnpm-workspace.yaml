allowBuilds:
  sharp: true
  unrs-resolver: true

# CodeMirror extensions exchange class instances at runtime. Pin the core
# packages exactly so pnpm cannot install incompatible duplicate copies.
overrides:
  "@codemirror/commands": "6.11.1"
  "@codemirror/language": "6.13.1"
  "@codemirror/state": "6.7.6"
  "@codemirror/view": "6.43.15"
